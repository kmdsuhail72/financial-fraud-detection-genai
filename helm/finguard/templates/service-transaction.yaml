apiVersion: v1
kind: Service
metadata:
  name: {{ include "finguard.name" . }}-transaction
  labels:
    {{- include "finguard.labels" . | nindent 4 }}
spec:
  type: {{ .Values.transactionService.service.type }}
  ports:
    - port: {{ .Values.transactionService.service.port }}
      targetPort: {{ .Values.transactionService.service.port }}
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "finguard.name" . }}-transaction

