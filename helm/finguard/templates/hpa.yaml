{{- if .Values.transactionService.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "finguard.name" . }}-transaction-hpa
  labels:
    {{- include "finguard.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "finguard.name" . }}-transaction
  minReplicas: {{ .Values.transactionService.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.transactionService.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.transactionService.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
---
{{- if .Values.fraudService.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "finguard.name" . }}-fraud-hpa
  labels:
    {{- include "finguard.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "finguard.name" . }}-fraud
  minReplicas: {{ .Values.fraudService.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.fraudService.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.fraudService.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}

