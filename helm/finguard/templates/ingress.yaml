{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "finguard.name" . }}-ingress
  labels:
    {{- include "finguard.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /transactions
            pathType: Prefix
            backend:
              service:
                name: {{ include "finguard.name" . }}-transaction
                port:
                  number: {{ .Values.transactionService.service.port }}
          - path: /score
            pathType: Prefix
            backend:
              service:
                name: {{ include "finguard.name" . }}-fraud
                port:
                  number: {{ .Values.fraudService.service.port }}
{{- end }}
