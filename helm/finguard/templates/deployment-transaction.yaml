apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "finguard.name" . }}-transaction
  labels:
    {{- include "finguard.labels" . | nindent 4 }}
    app.kubernetes.io/component: transaction-service
spec:
  replicas: {{ .Values.transactionService.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "finguard.name" . }}-transaction
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "finguard.name" . }}-transaction
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: transaction-service
          image: "{{ .Values.transactionService.image.repository }}:{{ .Values.transactionService.image.tag }}"
          imagePullPolicy: {{ .Values.transactionService.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.transactionService.service.port }}
          resources:
            {{- toYaml .Values.transactionService.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /startup
              port: {{ .Values.transactionService.service.port }}
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /live
              port: {{ .Values.transactionService.service.port }}
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: {{ .Values.transactionService.service.port }}
            periodSeconds: 5
