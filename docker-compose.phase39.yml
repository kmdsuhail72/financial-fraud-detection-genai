version: "3.8"

services:
  redis:
    image: redis:7.2-alpine
    container_name: finguard-redis-local
    command: redis-server --appendonly yes --requirepass finguard_local_pass
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "finguard_local_pass", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: finguard-api-caching
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=finguard_local_pass
      - PREFER_REDIS=true
      - ENVIRONMENT=local
    ports:
      - "8039:8000"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
