# Prometheus Server Configuration for FinGuard AI
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'finguard-eks-mumbai'
    region: 'ap-south-1'
    environment: 'production'

rule_files:
  - 'alert.rules.yml'

scrape_configs:
  - job_name: 'finguard-api-gateway'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['localhost:8000', 'localhost:8036']
        labels:
          service: 'finguard-gateway'
          tier: 'edge'

  - job_name: 'finguard-transaction-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['transaction-service.finguard.svc.cluster.local:8000']
        labels:
          service: 'transaction-service'
          tier: 'backend'

  - job_name: 'finguard-fraud-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['fraud-service.finguard.svc.cluster.local:8000']
        labels:
          service: 'fraud-scoring-service'
          tier: 'ml-backend'

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['localhost:8889']
        labels:
          service: 'otel-collector'

