# OpenTelemetry Collector Configuration for FinGuard AI
# Ingests traces, metrics, and logs via OTLP; processes, batches, and exports to Prometheus & CloudWatch/X-Ray.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 256
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 20
  resourcedetection:
    detectors: [env, system]
    timeout: 2s

exporters:
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: "finguard"
    const_labels:
      environment: "production"
      region: "ap-south-1"

  logging:
    verbosity: detailed

  # AWS X-Ray exporter (for distributed traces in AWS Mumbai)
  awsxray:
    region: ap-south-1
    index_slices: ["customer_id", "transaction_id"]

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  pprof:
    endpoint: 0.0.0.0:1777
  zpages:
    endpoint: 0.0.0.0:55679

service:
  extensions: [health_check, pprof, zpages]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [logging, awsxray]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus, logging]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [logging]
  telemetry:
    logs:
      level: info

