# SonarQube Scanner Configuration for FinGuard AI
sonar.projectKey=finguard-ai-enterprise
sonar.projectName=FinGuard AI Platform
sonar.projectVersion=1.0.0

sonar.sources=api,gateway,events,services
sonar.tests=tests
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.version=3.11

sonar.exclusions=**/__pycache__/**,frontend/**,artifacts/**,node_modules/**
sonar.sourceEncoding=UTF-8

# Quality Gate Thresholds
sonar.qualitygate.wait=true
sonar.coverage.exclusions=**/tests/**,**/examples/**
