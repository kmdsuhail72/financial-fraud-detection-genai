apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: finguard-fraud-service
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/kmdsuhail72/financial-fraud-detection-genai.git
    targetRevision: HEAD
    path: helm/finguard
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: finguard
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
