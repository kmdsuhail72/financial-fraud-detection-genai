apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: finguard-root-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/kmdsuhail72/financial-fraud-detection-genai.git
    targetRevision: HEAD
    path: gitops/argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

