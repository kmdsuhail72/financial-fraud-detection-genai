name: FinGuard AI — Enterprise DevSecOps & GitOps Pipeline

on:
  push:
    branches: [main, release/*]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write
  packages: write

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY_PREFIX: finguard
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # Stage 1: Static Code Analysis, Linting & Python Tests
  code-quality-and-test:
    name: Code Quality & Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-cov bandit

      - name: Lint with Flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Security SAST Scan with Bandit
        run: |
          bandit -r api gateway events services -ll -ii || true

      - name: Run Test Suite with Coverage
        run: |
          pytest --cov=. --cov-report=xml:coverage.xml --cov-fail-under=80

      - name: SonarQube Quality Gate Check
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        continue-on-error: true

  # Stage 2: Infrastructure as Code (IaC) Security Scan
  iac-security:
    name: Terraform & Kubernetes Policy Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Checkov IaC Security Scanner
        uses: bridgecrewio/checkov-action@master
        with:
          framework: terraform,kubernetes,helm
          output_format: cli
          soft_fail: true

  # Stage 3: Container Build & Trivy Vulnerability Scan
  container-security:
    name: Docker Build & Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [code-quality-and-test, iac-security]
    strategy:
      matrix:
        service: [transaction-service, fraud-service]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/docker/setup-buildx-action@v3

      - name: Build Local Container Image
        run: |
          DOCKERFILE="docker/Dockerfile.transaction"
          if [ "${{ matrix.service }}" = "fraud-service" ]; then
            DOCKERFILE="docker/Dockerfile.fraud"
          fi
          docker build -f $DOCKERFILE -t finguard/${{ matrix.service }}:${{ env.IMAGE_TAG }} .

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "finguard/${{ matrix.service }}:${{ env.IMAGE_TAG }}"
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

  # Stage 4: GitOps Argo CD Sync Trigger
  gitops-sync:
    name: Argo CD Continuous Delivery
    runs-on: ubuntu-latest
    needs: [container-security]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout GitOps Repo
        uses: actions/checkout@v4

      - name: Update Helm Image Tags
        run: |
          echo "Updating deployment image tag to ${{ env.IMAGE_TAG }}"
          sed -i "s/tag: .*/tag: \"${{ env.IMAGE_TAG }}\"/g" helm/finguard/values.yaml

      - name: Trigger Argo CD Sync via Webhook
        run: |
          echo "Simulated Argo CD webhook sync trigger payload for commit ${{ github.sha }}"
