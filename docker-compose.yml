services:
  postgres:
    image: postgres:15-alpine
    container_name: finguard-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finguard_secret}
      POSTGRES_DB: ${POSTGRES_DB:-finguard}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deployment/docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finguard -d finguard"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: finguard-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: ../deployment/docker/Dockerfile.backend
    container_name: finguard-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://finguard:finguard_secret@postgres:5432/finguard
      - APP_ENV=development
      - AWS_REGION=ap-south-1
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  transaction-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.transaction
    container_name: finguard-transaction-service
    ports:
      - "8101:8101"
    environment:
      - ENVIRONMENT=local
      - PORT=8101
      - FRAUD_SERVICE_URL=http://fraud-service:8102
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8101/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    restart: unless-stopped

  fraud-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.fraud
    container_name: finguard-fraud-service
    ports:
      - "8102:8102"
    environment:
      - ENVIRONMENT=local
      - PORT=8102
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8102/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:

