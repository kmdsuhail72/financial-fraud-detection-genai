apiVersion: v1
kind: ConfigMap
metadata:
  name: finguard-resource-sizing-profile
  namespace: finguard
  labels:
    app.kubernetes.io/part-of: finguard-ai
    component: capacity-planning
data:
  sizing-guidelines.json: |
    {
      "transaction-service": {
        "pod_capacity_rps": 50,
        "requests": { "cpu": "250m", "memory": "512Mi" },
        "limits": { "cpu": "1000m", "memory": "1024Mi" },
        "target_utilization_pct": 65,
        "probes": {
          "liveness": { "path": "/health", "initialDelaySeconds": 15, "periodSeconds": 10 },
          "readiness": { "path": "/health", "initialDelaySeconds": 5, "periodSeconds": 5 }
        }
      },
      "fraud-scoring-service": {
        "pod_capacity_rps": 25,
        "requests": { "cpu": "500m", "memory": "1024Mi" },
        "limits": { "cpu": "2000m", "memory": "2048Mi" },
        "target_utilization_pct": 65,
        "probes": {
          "liveness": { "path": "/health", "initialDelaySeconds": 20, "periodSeconds": 10 },
          "readiness": { "path": "/health", "initialDelaySeconds": 10, "periodSeconds": 5 }
        }
      }
    }
